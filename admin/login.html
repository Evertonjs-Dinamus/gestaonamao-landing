<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Gestão na Mão</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <div class="text-center mb-6">
        <div class="inline-block bg-orange-500 text-white px-3 py-1 rounded-md text-xs font-bold mb-3">
          ADMIN
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Gestão na Mão</h1>
        <p class="text-slate-500 text-sm mt-1">Painel de controle</p>
      </div>

      <div id="checking" class="text-center py-4 text-slate-500 text-sm">
        Verificando sessão...
      </div>

      <div id="form-login" class="hidden space-y-4">
        
        <button
          id="btn-google"
          class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-2.5 rounded-lg transition disabled:opacity-50"
        >
          <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
          </svg>
          Entrar com Google
        </button>

        <div class="flex items-center gap-3 py-2">
          <div class="flex-1 h-px bg-slate-200"></div>
          <span class="text-xs text-slate-400">ou com senha</span>
          <div class="flex-1 h-px bg-slate-200"></div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input
            id="email"
            type="email"
            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none"
            placeholder="seu@email.com"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
          <input
            id="senha"
            type="password"
            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none"
            placeholder="••••••••"
          >
        </div>

        <button
          id="btn-entrar"
          class="w-full bg-orange-500 hover:bg-orange-600 disabled:opacity-50 text-white font-semibold py-2.5 rounded-lg transition"
        >
          Entrar com senha
        </button>

        <div id="erro" class="hidden text-red-600 text-sm text-center mt-2"></div>
      </div>
    </div>

    <p class="text-center text-slate-400 text-xs mt-6">
      Área restrita. Acesso registrado.
    </p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { CONFIG } from './assets/config.js';

    const supabase = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

    const $checking = document.getElementById('checking');
    const $formLogin = document.getElementById('form-login');
    const $erro = document.getElementById('erro');
    const $btnGoogle = document.getElementById('btn-google');
    const $btnEntrar = document.getElementById('btn-entrar');
    const $email = document.getElementById('email');
    const $senha = document.getElementById('senha');

    function mostrarErro(msg) {
      $erro.textContent = msg;
      $erro.classList.remove('hidden');
    }

    function limparErro() {
      $erro.classList.add('hidden');
      $erro.textContent = '';
    }

    function mostrarFormulario() {
      $checking.classList.add('hidden');
      $formLogin.classList.remove('hidden');
    }

    const { data: { session } } = await supabase.auth.getSession();

    if (session) {
      const { data: ehAdmin, error: errAdmin } = await supabase.rpc('is_admin');

      if (ehAdmin && !errAdmin) {
        window.location.href = './';
      } else {
        await supabase.auth.signOut();
        mostrarFormulario();
        mostrarErro('Esta conta não tem permissão de admin.');
      }
    } else {
      mostrarFormulario();
    }

    $btnGoogle.addEventListener('click', async () => {
      limparErro();
      $btnGoogle.disabled = true;
      $btnGoogle.textContent = 'Redirecionando...';

      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.href
        }
      });

      if (error) {
        mostrarErro('Erro: ' + error.message);
        $btnGoogle.disabled = false;
        $btnGoogle.textContent = 'Entrar com Google';
      }
    });

    async function loginSenha() {
      limparErro();
      const email = $email.value.trim();
      const password = $senha.value;

      if (!email || !password) {
        mostrarErro('Preencha email e senha.');
        return;
      }

      $btnEntrar.disabled = true;
      $btnEntrar.textContent = 'Entrando...';

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        mostrarErro('Email ou senha inválidos.');
        $btnEntrar.disabled = false;
        $btnEntrar.textContent = 'Entrar com senha';
        return;
      }

      const { data: ehAdmin, error: errAdmin } = await supabase.rpc('is_admin');

      if (errAdmin || !ehAdmin) {
        await supabase.auth.signOut();
        mostrarErro('Acesso negado. Esta conta não tem permissão de admin.');
        $btnEntrar.disabled = false;
        $btnEntrar.textContent = 'Entrar com senha';
        return;
      }

      window.location.href = './';
    }

    $btnEntrar.addEventListener('click', loginSenha);
    $email.addEventListener('keydown', e => { if (e.key === 'Enter') loginSenha(); });
    $senha.addEventListener('keydown', e => { if (e.key === 'Enter') loginSenha(); });
  </script>
</body>
</html>
